          '<div style="font-size:12px;color:var(--mut);margin-top:2px">'+(w.exercises||[]).length+' упр.'+(dur?' · '+dur:'')+'</div></div>' +
          '<button onclick="editWorkout(\''+todayStr()+'\','+w.id+')" style="background:none;border:none;font-size:17px;cursor:pointer;padding:4px 4px;-webkit-user-select:none;user-select:none;line-height:1" title="Редактировать">✏️</button>' +
          ((w.exercises||[]).length ? '<button onclick="repeatWorkout(\''+todayStr()+'\','+w.id+')" style="background:none;border:none;color:var(--pur);font-size:18px;cursor:pointer;padding:4px 4px;-webkit-user-select:none;user-select:none;line-height:1" title="Повторить на другую дату">🔁</button>' : '') +
          '<button onclick="deleteWorkout(\''+todayStr()+'\','+w.id+')" style="background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px 2px;-webkit-user-select:none;user-select:none;line-height:1">✕</button>' +
          '</div>';
      });
      h += '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn btn-acc" style="flex:2;border-radius:14px;height:44px" onclick="startWorkout()">+ Ещё тренировка</button>' +
        '<button class="btn btn-plan" style="flex:1;border-radius:14px;height:44px;font-size:13px;font-weight:700" onclick="showPlanDateSheet()">📋 План</button>' +
        '</div>';
      if (!rcvActive) h += '<button class="btn btn-full btn-rcv" onclick="startRecovery()" style="margin-top:8px;border-radius:14px;height:42px">🔋 Запустить период восстановления</button>';
    }
    h += '</div>';
    pg.innerHTML = h;
    return;
  }

  var wkt = getWkt(ACTIVE_WKT.date, ACTIVE_WKT.wid);
  if (!wkt) { ACTIVE_WKT = null; renderWorkout(); return; }

  var elapsed = WKT_START ? fmtTime(Math.floor((Date.now()-WKT_START)/1000)) : '0:00';
  var kg = 0, sets = 0;
  (wkt.exercises||[]).forEach(function(ex) {
    (ex.sets||[]).forEach(function(s){ if(s.done){ sets++; if(!s.warmup) kg += (s.w||0)*(s.r||1); } });
  });

  var h = '<div class="wkt-head">' +
    '<div class="wkt-actions">' +
    '<div style="min-width:0">' +
    '<div class="sec-badge">Активная тренировка</div>' +
    '<input class="wkt-name-inp" value="'+esc(wkt.name)+'" placeholder="Название" oninput="setActiveName(this.value)" onfocus="this.select()">' +
    '<div class="wkt-timer-row"><div class="wkt-dot"></div><span id="wkt-timer-disp">'+elapsed+'</span>' +
    '<span style="margin-left:6px;color:var(--dim)">· '+(wkt.loc==='pool'?'🌊 Бассейн':'🏋️ Зал')+'</span></div>' +
    '</div>' +
    '<button class="btn btn-red btn-sm" onclick="finishWorkout()" style="flex-shrink:0;white-space:nowrap">✓ Завершить</button>' +
    '</div>' +
    '<div class="wkt-stats">' +
    '<div class="stat-pill"><div class="stat-pill-lbl">Объём</div>' +
    '<div class="stat-pill-val" id="vol-kg">'+kg+'</div></div>' +
    '<div class="stat-pill"><div class="stat-pill-lbl">Подходы</div>' +
    '<div class="stat-pill-val green" id="vol-sets">'+sets+'</div></div>' +
    '</div></div>';

  // Location toggle inside workout
  h += '<div style="display:flex;background:var(--card2);border:1px solid var(--brd2);border-radius:8px;overflow:hidden;margin:0 14px 4px;max-width:560px;margin-left:auto;margin-right:auto">' +
    '<button style="flex:1;padding:7px 12px;font-size:12px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:all .15s;'+
    (wkt.loc!=='pool'?'background:rgba(34,197,94,0.2);color:var(--acc)':'background:none;color:var(--sub)')+'" onclick="setWktLoc(\'gym\')">🏋️ Зал</button>' +
    '<button style="flex:1;padding:7px 12px;font-size:12px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:all .15s;'+
    (wkt.loc==='pool'?'background:rgba(56,189,248,0.15);color:var(--blu)':'background:none;color:var(--sub)')+'" onclick="setWktLoc(\'pool\')">🌊 Бассейн</button>' +
    '</div>';

  h += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;max-width:560px;margin:0 auto 4px;padding:0 14px;font-size:12px;color:var(--mut)">' +
    '<span>⏱ Отдых между подходами</span>' +
    '<button onclick="setRestSetCfg(-5)" style="width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--brd2);color:var(--txt);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none">−</button>' +
    '<span style="font-weight:700;color:var(--txt);min-width:34px;text-align:center">'+fmtTime(defaultRestSet())+'</span>' +
    '<button onclick="setRestSetCfg(5)" style="width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--brd2);color:var(--txt);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none">+</button>' +
    '</div>';

  h += '<div style="max-width:560px;margin:0 auto 6px;padding:0 14px">' +
    '<input type="text" class="wkt-note-input" value="'+esc(wkt.note||'')+'" placeholder="+ заметка к тренировке" oninput="updateWktNote(this.value)" />' +
    '</div>';

  // Таймер подходов (для статики) — опционально
  if ((wkt.exercises||[]).some(function(ex){ return isStatic(ex.name); })) {
    h += '<button onclick="openWorkoutTimer()" style="display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);max-width:560px;margin:6px auto 2px;height:46px;border-radius:14px;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.4);color:#34d399;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none">⏱️ Таймер подходов</button>';
  }

  h += '<div class="ex-list">';
  var exs = wkt.exercises || [];
  exs.forEach(function(ex, ei) {
    var doneSets = ex.sets.filter(function(s){return s.done;}).length;
    var cardio = isCardio(ex.name);
    var swim   = isSwim(ex.name);
    var stat   = isStatic(ex.name);
    var color = exTileColor(ex.name);
    var group = exGroup(ex.name);
    var exVol = 0;
    ex.sets.forEach(function(s){ if(s.done && !s.warmup) exVol += (s.w||0)*(s.r||1); });

    if (ei > 0) h += superlinkRowHtml(ei, ex.linkedToPrev, ex.linkedToPrev ? exs[groupStartIdx(exs, ei)].groupName : null);

    var groupStart = !ex.linkedToPrev && exs[ei+1] && exs[ei+1].linkedToPrev;
    if (groupStart) {
      h += groupNameInputHtml(ei, ex.groupName);
      h += '<button onclick="startCircuit('+ei+')" style="width:100%;height:44px;border-radius:12px;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.4);color:#34d399;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;margin-bottom:-1px">▶ Начать круг</button>';
    }

    h += '<div class="ex-card"'+(ex.linkedToPrev?' style="border-left:3px solid var(--acc)"':'')+'>';
    h += '<div class="ex-card-hd">' +
      '<div class="ex-tile" style="background:'+color+';opacity:0.85">'+letterOf(ex.name)+'</div>' +
      '<div class="ex-info">' +
        '<div class="ex-name">'+esc(exTitle(ex))+'</div>' +
        '<div class="ex-sub">'+(group||'Упражнение')+' · '+doneSets+'/'+ex.sets.length+' подх.</div>' +
      '</div>' +
      (exVol > 0 ? '<div class="ex-vol">'+exVol+' кг</div>' : '') +
      '</div>';

    h += '<div class="ex-body open">';
    h += styleChips(ex, ei);
    h += '<input type="text" class="ex-note-input" value="'+esc(ex.note||'')+'" placeholder="+ заметка" oninput="updateExNote('+ei+',this.value)" onclick="event.stopPropagation()" />';
    if (!cardio && !swim && !stat) {
      var st = getExStats(ex.name);
      if (st) {
        h += '<div class="ex-hist">' +
          '<span>Посл: <span class="ex-hist-val">'+st.lastW+' кг × '+st.lastR+'</span></span>' +
          (st.pr > st.lastW ? '<span>PR: <span class="ex-hist-pr">'+st.pr+' кг</span></span>' : '') +
          '</div>';
        var rpeHint = rpeSuggestionText(st.lastRPE);
        if (rpeHint) h += '<div style="font-size:11px;color:var(--acc);margin:2px 0 4px 2px">'+rpeHint+'</div>';
      }
      h += '<div class="sets-hdr" style="grid-template-columns:26px 1fr 0.85fr 34px 44px"><div>№</div><div>Вес</div><div>Повт</div><div>RPE</div><div></div></div>';
      h += '<div style="font-size:10px;color:var(--mut);margin:-4px 0 6px 2px">Тапни № — отметить разминочный подход</div>';
    } else if (stat) {
      h += '<div class="sets-hdr" style="grid-template-columns:26px 1fr 30px"><div>№</div><div>Удержание</div><div></div></div>';
    } else if (swim) {
      h += '<div class="sets-hdr" style="grid-template-columns:26px 1.15fr 0.95fr 30px"><div>№</div><div>Метраж</div><div>Время</div><div></div></div>';
    }
    ex.sets.forEach(function(s, si) {
      if (stat) {
        h += '<div class="set-row'+(s.done?' done':'')+'" style="grid-template-columns:26px 1fr 30px">';
        h += '<div class="set-n">'+(si+1)+'</div>';
        h += '<div class="set-cell'+(s.done?' done':'')+'" onclick="openSheet('+ei+','+si+',\'secs\')">'+(s.secs||60)+'<span class="set-cell-unit">сек</span></div>';
      } else if (swim) {
        h += '<div class="set-row'+(s.done?' done':'')+'" style="grid-template-columns:26px 1.15fr 0.95fr 30px">';
        h += '<div class="set-n">'+(si+1)+'</div>';
        h += '<div class="set-cell'+(s.done?' done':'')+'" onclick="openSheet('+ei+','+si+',\'swimdist\')">'+(s.dist||0)+'<span class="set-cell-unit">м</span></div>';
        h += '<div class="set-cell'+(s.done?' done':'')+'" onclick="openSheet('+ei+','+si+',\'swimtime\')">'+(s.secs ? fmtTime(s.secs) : '<span style="color:var(--dim);font-weight:600;font-size:13px">+ время</span>')+'</div>';
      } else {
        var rowStyle = cardio ? '' : ' style="grid-template-columns:26px 1fr 0.85fr 34px 44px"';
        h += '<div class="set-row'+(s.done?' done':'')+(s.warmup?' warmup-row':'')+'"'+rowStyle+'>';
        if (cardio) {
          h += '<div class="set-n">'+(si+1)+'</div>';
          h += '<div class="set-cell'+(s.done?' done':'')+'" onclick="openSheet('+ei+','+si+',\'mins\')">'+(s.mins||20)+'<span class="set-cell-unit">мин</span></div>';
          h += '<div class="set-cell'+(s.done?' done':'')+'" onclick="openSheet('+ei+','+si+',\'dist\')">'+(s.dist||0)+'<span class="set-cell-unit">'+distUnit(ex.name)+'</span></div>';
        } else {
          h += '<div class="set-n'+(s.warmup?' warmup':'')+'" onclick="toggleWarmup('+ei+','+si+')" title="Разминочный подход">'+(s.warmup?'Р':(si+1))+'</div>';
          h += '<div class="set-cell'+(s.done?' done':'')+'" onclick="openSheet('+ei+','+si+',\'w\')">'+(s.w||0)+'<span class="set-cell-unit">кг</span></div>';
          h += '<div class="set-cell'+(s.done?' done':'')+'" onclick="openSheet('+ei+','+si+',\'r\')">'+(s.r||0)+'<span class="set-cell-unit">повт</span></div>';
          h += '<div class="set-cell" onclick="openSheet('+ei+','+si+',\'rpe\')" style="font-size:13px">'+(s.rpe?s.rpe:'<span style="color:var(--dim)">–</span>')+'</div>';
        }
      }
      h += '<div class="set-circle'+(s.done?' done':'')+'" onclick="toggleSetDone('+ei+','+si+')">✓</div>';
      h += '</div>';
    });
    h += '<div class="add-row">' +
      '<button class="add-btn" onclick="addSet('+ei+')">+ Подход</button>' +
      (ex.sets.length>1?'<button class="del-btn" onclick="delSet('+ei+')">− Убрать</button>':'') +
      '</div>';
    var nextSet = -1;
    for (var si = 0; si < ex.sets.length; si++) if (!ex.sets[si].done){ nextSet = si; break; }
    if (nextSet !== -1) {
      var s = ex.sets[nextSet];
      var target = stat ? ((s.secs||60)+' сек') : swim ? ((s.dist||0)+' м'+(s.secs?' · '+fmtTime(s.secs):'')) : cardio ? ((s.mins||20)+' мин') : ((s.w||0)+' кг × '+(s.r||0));
      h += '<button class="set-rec-btn'+(swim?' pool':'')+'" onclick="recordSet('+ei+','+nextSet+')">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>' +
        'Записать подход · '+target+'</button>';
    }
    h += '<div class="ex-move-row">' +
      '<button class="ex-move-btn" onclick="moveEx('+ei+',-1)"'+(ei===0?' disabled':'')+'>↑</button>' +
      '<button class="ex-move-btn" onclick="moveEx('+ei+',1)"'+(ei===exs.length-1?' disabled':'')+'>↓</button>' +
      '<button class="rm-ex-btn" style="flex:1;margin-top:0" onclick="removeEx('+ei+')">Удалить упражнение</button>' +
      '</div>';
    h += '</div>';
    h += '</div>';
  });

  var addClr = wkt.loc==='pool' ? 'var(--blu)' : 'var(--acc)';
  var addBrd = wkt.loc==='pool' ? 'rgba(56,189,248,0.4)' : 'rgba(34,197,94,0.4)';
  h += '<button class="add-ex-btn" onclick="openDbModal()" style="border-color:'+addBrd+';color:'+addClr+'">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+addClr+'" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
    'Упражнение из базы</button>';
  h += '</div>';
  pg.innerHTML = h;
}

function toggleEx(ei) { OPEN_EX[ei] = !OPEN_EX[ei]; renderWorkout(); }

function toggleSetDone(ei, si) {
  if (!ACTIVE_WKT) return;
  var wkt = getWkt(ACTIVE_WKT.date, ACTIVE_WKT.wid);
  var s = wkt.exercises[ei].sets[si];
  s.done = !s.done;
  if (s.done && navigator.vibrate) navigator.vibrate(12);
  saveST(); updateVolBar(); renderWorkout();
}
function toggleWarmup(ei, si) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var s = wkt.exercises[ei].sets[si];
  s.warmup = !s.warmup;
  saveST(); updateVolBar(); renderWorkout();
}

function recordSet(ei, si) {
  if (!ACTIVE_WKT) return;
  var wkt = getWkt(ACTIVE_WKT.date, ACTIVE_WKT.wid);
  var ex = wkt.exercises[ei], s = ex.sets[si];
  var isPR = false;
  if (!isCardio(ex.name) && !isSwim(ex.name) && !isStatic(ex.name) && !s.warmup && (s.w||0) > 0) {
    var st = getExStats(ex.name);
    if (st && s.w > st.pr) isPR = true;
  }
  s.done = true;
  if (navigator.vibrate) navigator.vibrate(12);
  saveST(); startRest(defaultRestSet()); updateVolBar(); renderWorkout();
  if (isPR) uiPrToast(ex.name, s.w);
}

function addSet(ei) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var ex = wkt.exercises[ei];
  var last = ex.sets[ex.sets.length-1];
  ex.sets.push(Object.assign({}, last, {done:false}));
  saveST(); renderWorkout();
}
function delSet(ei) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var ex = wkt.exercises[ei];
  if (ex.sets.length > 1) { ex.sets.pop(); saveST(); renderWorkout(); }
}
function removeEx(ei) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var ex = wkt.exercises[ei];
  var doRemove = function(){
    wkt.exercises.splice(ei, 1);
    delete OPEN_EX[ei];
    saveST(); renderWorkout();
  };
  var hasDone = ex && (ex.sets||[]).some(function(s){ return s.done; });
  if (hasDone) uiConfirm('Удалить «'+exTitle(ex)+'»? Записанные подходы будут потеряны.', doRemove);
  else doRemove();
}
function moveEx(ei, dir) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var j = ei + dir;
  if (j < 0 || j >= wkt.exercises.length) return;
  var tmp = wkt.exercises[ei]; wkt.exercises[ei] = wkt.exercises[j]; wkt.exercises[j] = tmp;
  var a = OPEN_EX[ei], b = OPEN_EX[j]; OPEN_EX[ei] = b; OPEN_EX[j] = a;
  saveST(); renderWorkout();
}
function toggleSuperset(ei) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var ex = wkt.exercises[ei];
  if (ei === 0 || !ex) return;
  ex.linkedToPrev = !ex.linkedToPrev;
  saveST(); renderWorkout();
}
function groupStartIdx(exs, ei) {
  var idx = ei;
  while (idx > 0 && exs[idx].linkedToPrev) idx--;
  return idx;
}
function superlinkRowHtml(ei, linked, groupName) {
  if (linked) {
    var label = groupName ? esc(groupName) : 'Суперсет';
    return '<div onclick="toggleSuperset('+ei+');event.stopPropagation()" style="display:flex;align-items:center;gap:8px;margin:-1px 4px;padding:5px 4px;font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;cursor:pointer;-webkit-user-select:none;user-select:none">' +
      '<span style="flex:1;height:1px;background:var(--acc-brd)"></span>⛓ '+label+' — тапни, чтобы разъединить<span style="flex:1;height:1px;background:var(--acc-brd)"></span>' +
      '</div>';
  }
  return '<button onclick="toggleSuperset('+ei+');event.stopPropagation()" style="display:block;width:100%;background:none;border:none;padding:2px 4px;margin:-3px 0 1px;font-size:11px;font-weight:600;color:var(--dim);font-family:inherit;cursor:pointer;text-align:left;-webkit-user-select:none;user-select:none">🔗 Объединить с предыдущим в суперсет</button>';
}
function setGroupName(ei, val) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  if (wkt.exercises[ei]) wkt.exercises[ei].groupName = val;
  saveST();
}
function groupNameInputHtml(ei, groupName) {
  return '<input type="text" value="'+esc(groupName||'')+'" placeholder="Название круга (необязательно)" oninput="setGroupName('+ei+',this.value)" onclick="event.stopPropagation()" style="width:100%;background:var(--card2);border:1px solid var(--brd2);border-radius:10px;padding:8px 10px;color:var(--txt);font-size:12px;font-family:inherit;box-sizing:border-box;margin-bottom:6px" />';
}
function updateExNote(ei, val) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  if (wkt.exercises[ei]) wkt.exercises[ei].note = val;
  saveST();
}
function updateWktNote(val) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  if (wkt) wkt.note = val;
  saveST();
}
function addExToWorkout(name) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var ex = makeEx(name);
  wkt.exercises.push(ex);
  saveST(); dbClose(); renderWorkout();
  setTimeout(function(){
    var pg = document.getElementById('pg-workout');
    if (pg) pg.scrollTop = pg.scrollHeight;
  }, 80);
}

// ═══════════════════════ REST TIMER ═══════════════════════
function defaultRestSet() { return (ST.cfg && ST.cfg.restSet != null) ? ST.cfg.restSet : 45; }
function setRestSetCfg(delta) {
  if (!ST.cfg) ST.cfg = {};
  ST.cfg.restSet = Math.max(0, defaultRestSet() + delta);
  saveST();
  renderWorkout();
}
function startRest(sec) {
  REST_SEC = sec; REST_TOTAL = sec; REST_RUNNING = true;
  document.getElementById('rest-bar').classList.add('vis');
  updateRestDisplay();
  if (REST_ID) clearInterval(REST_ID);
  REST_ID = setInterval(tickRest, 1000);
}
function tickRest() {
  if (!REST_RUNNING) return;
  REST_SEC--;
  if (REST_SEC <= 0) { restStop(); return; }
  updateRestDisplay();
}
function updateRestDisplay() {
  document.getElementById('rest-time').textContent = fmtTime(REST_SEC);
  document.getElementById('rest-tog').textContent = REST_RUNNING ? '⏸' : '▶';
  var ratio = REST_TOTAL > 0 ? Math.max(0,Math.min(1,REST_SEC/REST_TOTAL)) : 0;
  var arc = document.getElementById('rest-ring-arc');
  if (arc) arc.setAttribute('stroke-dashoffset', String(113*(1-ratio)));
}
function restToggle() { REST_RUNNING = !REST_RUNNING; document.getElementById('rest-tog').textContent = REST_RUNNING?'⏸':'▶'; }
function restAdd(sec) {
  REST_SEC += sec; REST_TOTAL = Math.max(REST_TOTAL, REST_SEC);
  if (!REST_RUNNING) { REST_RUNNING = true; if (!REST_ID) REST_ID = setInterval(tickRest,1000); }
  updateRestDisplay();
}
function restStop() {
  REST_RUNNING = false; REST_SEC = 0;
  if (REST_ID) { clearInterval(REST_ID); REST_ID = null; }
  document.getElementById('rest-bar').classList.remove('vis');
}

// ═══════════════════════ ТАЙМЕР ПОДХОДОВ (статика) ═══════════════════════
function tmrBeep(freq, dur) {

// ═══════════════════════ BOTTOM SHEET (DRUM PICKER) ═══════════════════════
function openSheet(ei, si, field) {
  var ref = curWktRef(); if (!ref) return;
  var wkt = getWkt(ref.date, ref.wid);
  var s = wkt.exercises[ei].sets[si];

    cur = s.w||0; step = 2.5; unit = 'кг';
    for (var v=0; v<=300; v+=2.5) range.push(Math.round(v*10)/10);
    presets = [[-5,'−5'],[- 2.5,'−2,5'],[2.5,'+2,5'],[5,'+5']];
    document.getElementById('sh-title').textContent = 'Вес (кг)';
  } else if (field === 'r') {
    cur = s.r||0; step = 1; unit = 'повт';
    for (var v=0; v<=50; v++) range.push(v);
    presets = [[-2,'−2'],[-1,'−1'],[1,'+1'],[2,'+2']];
    document.getElementById('sh-title').textContent = 'Повторения';
  } else if (field === 'mins') {
    cur = s.mins||20; step = 1; unit = 'мин';
    for (var v=1; v<=120; v++) range.push(v);
    presets = [[-5,'−5'],[-1,'−1'],[1,'+1'],[5,'+5']];
    document.getElementById('sh-title').textContent = 'Время (мин)';
  } else if (field === 'dist') {
    if (isStairs(wkt.exercises[ei].name)) {
      cur = s.dist||0; step = 1; unit = 'этаж';
      for (var v=0; v<=300; v++) range.push(v);
      presets = [[-10,'−10'],[-5,'−5'],[5,'+5'],[10,'+10']];
      document.getElementById('sh-title').textContent = 'Этажи';
    } else {
      cur = s.dist||0; step = 0.5; unit = 'км';
      for (var v=0; v<=50; v+=0.5) range.push(Math.round(v*10)/10);
      presets = [[-1,'−1'],[-0.5,'−0,5'],[0.5,'+0,5'],[1,'+1']];
      document.getElementById('sh-title').textContent = 'Дистанция (км)';
    }
  } else if (field === 'secs') {
    cur = s.secs||60; step = 5; unit = 'сек';
    for (var v=5; v<=300; v+=5) range.push(v);
    presets = [[-15,'−15'],[-5,'−5'],[5,'+5'],[15,'+15']];
    document.getElementById('sh-title').textContent = 'Удержание (сек)';
  } else if (field === 'swimdist') {
    cur = s.dist||100; step = 25; unit = 'м';
    for (var v=0; v<=3000; v+=25) range.push(v);
    presets = [[-50,'−50'],[-25,'−25'],[25,'+25'],[50,'+50']];
    document.getElementById('sh-title').textContent = 'Метраж (м)';
  } else if (field === 'swimtime') {
    cur = s.secs||60; step = 5; unit = '';
    for (var v=0; v<=3600; v+=5) range.push(v);
    presets = [[-30,'−30с'],[-5,'−5с'],[5,'+5с'],[30,'+30с']];
    document.getElementById('sh-title').textContent = 'Время (мин:сек) · 0:00 — без времени';
  } else if (field === 'rpe') {
    cur = s.rpe||0; step = 1; unit = '';
    for (var v=0; v<=10; v++) range.push(v);
    presets = [[-1,'−1'],[1,'+1']];
    document.getElementById('sh-title').textContent = 'RPE — тяжесть подхода (0 — не указано)';
  }
  SH_RANGE = range; SH_VAL = cur; SH_STEP = step;
  SH_FMT = (field === 'swimtime') ? fmtTime : nf;
  document.getElementById('sh-val-unit').textContent = unit;
  document.getElementById('sh-manual-unit').textContent = unit;
  var ph = document.getElementById('sh-presets');
  ph.innerHTML = presets.map(function(p){
    return '<button class="preset" onclick="shPreset('+p[0]+')">'+p[1]+'</button>';
  }).join('');
  var drum = document.getElementById('sh-drum');
  drum.innerHTML = range.map(function(v){ return '<div class="drum-item">'+SH_FMT(v)+'</div>'; }).join('');
  shUpdateDisplay();
  applyInputMode(false);
  document.getElementById('sh-overlay').classList.add('vis');
  setTimeout(function(){
    var idx = range.indexOf(cur);
    if (idx === -1) { var best=0; for(var i=0;i<range.length;i++) if(Math.abs(range[i]-cur)<Math.abs(range[best]-cur)) best=i; idx=best; }
    drum.scrollTop = idx * 48;
    if (getInputMode() !== 'manual' || field === 'swimtime') SH_VAL = range[idx];
    highlightDrum();
    shUpdateDisplay();
  }, 50);
}
function shUpdateDisplay() {
  var unitEl = document.getElementById('sh-val-unit');
  var unit = unitEl ? unitEl.textContent : '';
  document.getElementById('sh-val-display').innerHTML = (SH_FMT||nf)(SH_VAL)+' <span class="sh-val-unit" id="sh-val-unit">'+unit+'</span>';
  var platesEl = document.getElementById('sh-plates');
  if (platesEl) {
    var pb = (SH_MODE && SH_MODE.field === 'w') ? plateBaseFor(SH_MODE.name) : null;
    platesEl.innerHTML = pb ? platesText(SH_VAL, pb.base, pb.label) : '';
  }
}
var BAR_KG = 20, PLATE_SET = [25,20,15,10,5,2.5,1.25];
var PLATE_BASE = {'Жим ногами 45°': 64};
function isBarbell(name) { return /штанг/i.test(name||'') || name === 'Становая тяга' || name === 'Румынская тяга'; }
function plateBaseFor(name) {
  if (PLATE_BASE.hasOwnProperty(name)) return {base:PLATE_BASE[name], label:'платформа'};
  if (isBarbell(name)) return {base:BAR_KG, label:'гриф'};
  return null;
}
function platesBreakdown(totalKg, base) {
  var perSide = (totalKg - base) / 2;
  if (perSide <= 0) return null;
  var remaining = Math.round(perSide*100)/100, used = [];
  for (var i = 0; i < PLATE_SET.length; i++) {
    var p = PLATE_SET[i];
    while (remaining + 1e-6 >= p) { used.push(p); remaining = Math.round((remaining-p)*100)/100; }
  }
  return {plates:used, leftover:remaining};
}
function fmtPlate(v) { return (Math.round(v*100)/100).toString().replace('.',','); }
function platesText(totalKg, base, label) {
  var b = platesBreakdown(totalKg, base);
  if (!b || !b.plates.length) return label+' '+base+' кг';
  var txt = '🔵 '+b.plates.map(fmtPlate).join(' + ')+' с каждой стороны';
  if (b.leftover > 0.01) txt += ' <span style="color:var(--red)">(+'+fmtPlate(b.leftover)+' не набрать)</span>';
  return txt;
}
function getInputMode() { return (ST.cfg && ST.cfg.inputMode === 'manual') ? 'manual' : 'drum'; }
function setInputMode(mode) {
  if (!ST.cfg) ST.cfg = {};
  ST.cfg.inputMode = mode; saveST();
  applyInputMode(true);
  // При возврате к барабану подкручиваем его к текущему значению
  if (mode === 'drum' && SH_RANGE.length) {
    var best = 0;
    for (var i=0;i<SH_RANGE.length;i++) if (Math.abs(SH_RANGE[i]-SH_VAL) < Math.abs(SH_RANGE[best]-SH_VAL)) best = i;
    SH_VAL = SH_RANGE[best];
    var drum = document.getElementById('sh-drum');
    if (drum) drum.scrollTop = best * 48;
    highlightDrum(); shUpdateDisplay();
  }
}
function applyInputMode(focusIt) {
  var isTime = SH_MODE && SH_MODE.field === 'swimtime';
  var manual = getInputMode() === 'manual';
  var modeRow = document.getElementById('sh-mode');
  if (modeRow) modeRow.style.display = 'flex';
  var bd = document.getElementById('sh-mode-drum'), bm = document.getElementById('sh-mode-manual');
  if (bd) bd.className = manual ? '' : 'on';
  if (bm) bm.className = manual ? 'on' : '';
  var dw = document.getElementById('sh-drum-wrap'), mw = document.getElementById('sh-manual-wrap'), mtw = document.getElementById('sh-manual-time-wrap'), disp = document.getElementById('sh-val-display');
  if (manual) {
    if (dw) dw.style.display = 'none';
    if (disp) disp.style.display = 'none';
    if (isTime) {
      if (mw) mw.style.display = 'none';
      if (mtw) mtw.style.display = 'flex';
      var mIn = document.getElementById('sh-manual-min'), sIn = document.getElementById('sh-manual-sec');
      if (mIn && sIn) {
        var totalSec = Math.max(0, Math.round(SH_VAL));
        mIn.value = Math.floor(totalSec/60);
        sIn.value = totalSec%60;
        if (focusIt) setTimeout(function(){ mIn.focus(); mIn.select(); }, 60);
      }
    } else {
      if (mw) mw.style.display = 'flex';
      if (mtw) mtw.style.display = 'none';
      var inp = document.getElementById('sh-manual-input');
      if (inp) {
        inp.type = 'number'; inp.setAttribute('inputmode','decimal'); inp.step = SH_STEP || 1;
        inp.value = Math.round(SH_VAL*100)/100;
        if (focusIt) setTimeout(function(){ inp.focus(); inp.select(); }, 60);
      }
    }
  } else {
    if (dw) dw.style.display = 'block';
    if (mw) mw.style.display = 'none';
    if (mtw) mtw.style.display = 'none';
    if (disp) disp.style.display = 'block';
  }
}
function shManualInput() {
  var inp = document.getElementById('sh-manual-input');
  var v = parseFloat(inp.value);
  if (!isNaN(v)) SH_VAL = v;
}
function shManualTimeInput() {
  var mIn = document.getElementById('sh-manual-min'), sIn = document.getElementById('sh-manual-sec');
  var m = parseInt(mIn.value, 10)||0, s = parseInt(sIn.value, 10)||0;
  SH_VAL = m*60 + s;
}
function drumScroll() {
  var drum = document.getElementById('sh-drum');
  var idx = Math.round(drum.scrollTop/48);
  idx = Math.max(0,Math.min(idx,SH_RANGE.length-1));
  SH_VAL = SH_RANGE[idx];
  highlightDrum();
  shUpdateDisplay();
}
function highlightDrum() {
  var drum = document.getElementById('sh-drum');
  var items = drum.querySelectorAll('.drum-item');
  var idx = SH_RANGE.indexOf(SH_VAL);
  items.forEach(function(el,i){
    el.style.color = i===idx ? 'var(--txt)' : 'var(--dim)';
    el.style.fontSize = i===idx ? '32px' : '26px';
  });
}
function shPreset(delta) {
  if (getInputMode() === 'manual' && !(SH_MODE && SH_MODE.field === 'swimtime')) {
    SH_VAL = Math.max(0, Math.round((SH_VAL+delta)*100)/100);
    var inp = document.getElementById('sh-manual-input');
    if (inp) inp.value = SH_VAL;
    return;
  }
  var next = Math.round((SH_VAL+delta)*100)/100;
  next = Math.max(SH_RANGE[0], Math.min(SH_RANGE[SH_RANGE.length-1], next));
  var best=0; for(var i=0;i<SH_RANGE.length;i++) if(Math.abs(SH_RANGE[i]-next)<Math.abs(SH_RANGE[best]-next)) best=i;
  SH_VAL = SH_RANGE[best];
  document.getElementById('sh-drum').scrollTop = best*48;
  highlightDrum();
}
function shClose(e) {
  if (!e || e.target===document.getElementById('sh-overlay'))
    document.getElementById('sh-overlay').classList.remove('vis'), SH_MODE=null;
}
function shConfirm() {
  var ref = curWktRef();
  if (!SH_MODE || !ref) { shClose(); return; }
  var wkt = getWkt(ref.date, ref.wid);
  var key = SH_MODE.field;
  if (key === 'swimtime') key = 'secs';
  else if (key === 'swimdist') key = 'dist';
  var val = (typeof SH_VAL === 'number' && !isNaN(SH_VAL)) ? SH_VAL : 0;
  val = Math.max(0, Math.round(val*100)/100);
  wkt.exercises[SH_MODE.ei].sets[SH_MODE.si][key] = val;
  saveST();
  document.getElementById('sh-overlay').classList.remove('vis');
  SH_MODE = null;
  if (CIRC) renderCirc(); else renderWorkout();
}

function dbModeFilters() {

function dbFilter(key) { DB_FILTER = DB_FILTER===key?null:key; renderDbChips(); dbRender(); }

function dbExsForGroup(groupKey) {
  // Map UI filter key → actual DB group name
  var dbGroup = groupKey;
  if (groupKey==='Плавание') dbGroup = 'Стили';
  var results = [];
  DB_SECTIONS.forEach(function(sec){
    var exs = sec.groups[dbGroup];
    if (exs) exs.forEach(function(name){ results.push({name:name, icon:sec.icon}); });
  });
  (ST.customEx||[]).forEach(function(e){
    if (e.group === groupKey) results.push({name:e.name, icon:'⭐'});
  });
  return results;
}

function dbPick(name) {
  if (!ST.recentEx) ST.recentEx = [];
  ST.recentEx = [name].concat(ST.recentEx.filter(function(n){ return n!==name; })).slice(0,10);
  saveST();
  DB_CB(name);
}
function dbRender() {
  var qRaw = (document.getElementById('db-search').value||'').trim();
  var q = qRaw.toLowerCase();
  var list = document.getElementById('db-list');
  var html = '';
  var exactMatch = false;

  function renderEx(ex) {
    if (ex.name.toLowerCase() === q) exactMatch = true;
    var isCustom = ex.icon === '⭐';
    return '<div class="db-item" onclick="dbPick(\''+ex.name.replace(/'/g,"\\'")+'\')">'+
      '<div class="db-item-name">'+esc(ex.name)+'</div>'+
      (isCustom ? '<button onclick="event.stopPropagation();delCustomEx(\''+ex.name.replace(/'/g,"\\'")+'\')" style="background:none;border:none;color:var(--red);font-size:14px;cursor:pointer;padding:4px;flex-shrink:0">✕</button>' : '') +
      '<span style="font-size:16px">'+ex.icon+'</span></div>';
  }

  if (DB_FILTER) {
    var exs = dbExsForGroup(DB_FILTER).filter(function(e){ return !q||e.name.toLowerCase().indexOf(q)!==-1; });
    html = exs.length ? exs.map(renderEx).join('') : '<div class="empty" style="padding:20px">Ничего не найдено</div>';
  } else {
    var validNames = {};
    dbModeFilters().forEach(function(f){ dbExsForGroup(f.key).forEach(function(e){ validNames[e.name] = e.icon; }); });
    if (!q && ST.recentEx && ST.recentEx.length) {
      var recent = ST.recentEx.filter(function(n){ return validNames[n]; }).slice(0,6);
      if (recent.length) {
        html += '<div class="db-sec-hd">🕐 Недавние</div>';
        html += recent.map(function(n){ return renderEx({name:n, icon:validNames[n]}); }).join('');
      }
    }
    dbModeFilters().forEach(function(f){
      var exs = dbExsForGroup(f.key).filter(function(e){ return !q||e.name.toLowerCase().indexOf(q)!==-1; });
      if (!exs.length) return;
      html += '<div class="db-sec-hd">'+f.icon+' '+f.label+'</div>';
      html += exs.map(renderEx).join('');
    });
    if (!html) html = '<div class="empty" style="padding:20px">Ничего не найдено</div>';
  }
  if (qRaw && !exactMatch) {
    html += '<div class="db-item" style="opacity:.85" onclick="showAddCustomEx(\''+qRaw.replace(/'/g,"\\'")+'\')">'+
      '<div class="db-item-name">+ Добавить «'+esc(qRaw)+'» как новое</div>'+
      '<span style="font-size:16px">➕</span></div>';
  }
  list.innerHTML = html;
}
function showAddCustomEx(name) {

  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9700;display:flex;align-items:center;justify-content:center;padding:24px';

    '<button onclick="document.getElementById(\'custom-ex-ov\').remove()" style="width:100%;height:42px;border-radius:12px;background:none;border:1px solid var(--brd2);color:var(--sub);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:14px">Отмена</button>' +

function addCustomEx(name, groupKey) {
  if (!ST.customEx) ST.customEx = [];
  if (!ST.customEx.some(function(e){ return e.name===name; })) ST.customEx.push({name:name, group:groupKey});
  saveST();
  var ov = document.getElementById('custom-ex-ov'); if (ov) ov.remove();
  dbPick(name);
}
function delCustomEx(name) {
  uiConfirm('Удалить своё упражнение «'+name+'» из базы? Уже записанная история с ним останется.', function(){
    ST.customEx = (ST.customEx||[]).filter(function(e){ return e.name!==name; });
    saveST(); dbRender();
  });
}

// ═══════════════════════ CALENDAR ═══════════════════════
function renderCal() {
  var now = new Date();
  if (CAL_YEAR === undefined) { CAL_YEAR = now.getFullYear(); CAL_MONTH = now.getMonth(); }
  var today = todayStr();
  var months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('cal-month-lbl').textContent = months[CAL_MONTH]+' '+CAL_YEAR;

  // Stats
  var gymCnt = 0, poolCnt = 0;
  Object.keys(ST.w).forEach(function(ds){
    var day = ST.w[ds];
    if (day && day.workouts) day.workouts.forEach(function(w){ if(w.loc==='pool') poolCnt++; else gymCnt++; });
  });
  var total = gymCnt+poolCnt;
  document.getElementById('cal-stat').textContent = total+' '+(total===1?'тренировка':total<5?'тренировки':'тренировок')+' · '+gymCnt+' в зале · '+poolCnt+' в бассейне';

  var firstDay = new Date(CAL_YEAR, CAL_MONTH, 1);
  var lastDay = new Date(CAL_YEAR, CAL_MONTH+1, 0);
  var startDow = (firstDay.getDay()+6)%7;
  var dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var h = dows.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');
  for (var i=0; i<startDow; i++) {
    var pd = new Date(CAL_YEAR,CAL_MONTH,1-startDow+i);
    h += calCell(pd.getDate(), pd.getFullYear()+'-'+pad(pd.getMonth()+1)+'-'+pad(pd.getDate()), today, false);
  }
  for (var d=1; d<=lastDay.getDate(); d++) {
    h += calCell(d, CAL_YEAR+'-'+pad(CAL_MONTH+1)+'-'+pad(d), today, true);
  }
  var total2 = startDow+lastDay.getDate();
  var endPad = total2%7 ? 7-(total2%7) : 0;
  for (var i=1; i<=endPad; i++) {
    var nd = new Date(CAL_YEAR,CAL_MONTH+1,i);
    h += calCell(i, nd.getFullYear()+'-'+pad(nd.getMonth()+1)+'-'+pad(nd.getDate()), today, false);
  }
  document.getElementById('cal-grid').innerHTML = h;

  var LEGEND = [
    {color:'#f59e0b', label:'Ноги'},
    {color:'#22c55e', label:'Грудь'},
    {color:'#38bdf8', label:'Спина'},
    {color:'#a855f7', label:'Плечи'},
    {color:'#ec4899', label:'Руки'},
    {color:'#06b6d4', label:'Плавание'},
    {color:'#6366f1', label:'Кардио'},
    {color:'#f43f5e', label:'Статика'},
    {color:'#71717a', label:'Отдых'}
  ];
  document.getElementById('cal-legend').innerHTML = LEGEND.map(function(l){
    return '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:'+l.color+'"></div>'+l.label+'</div>';
  }).join('');

  renderCalDetail();
}
function calCell(num, ds, today, curMonth) {
  var day = ST.w[ds];
  var hasGym=false, hasPool=false, isRest=false;
  if (day&&day.workouts) day.workouts.forEach(function(w){ if(w.loc==='pool') hasPool=true; else hasGym=true; });
  if (day&&day.type==='rest') isRest=true;
  var cls = 'cal-cell';
  if (curMonth) cls += ' cur';
  if (ds===today) cls += ' today';
  if (ds===SEL_DATE) cls += ' sel';
  if (hasGym||hasPool||isRest) cls += ' has-w';
  var dots = getDayDots(ds);
  var dot = '';
  if (dots.length) {
    dot = '<div style="display:flex;gap:2px;align-items:center;justify-content:center">' +
      dots.map(function(c){ return '<div style="width:6px;height:6px;border-radius:50%;background:'+c+'"></div>'; }).join('') +
      '</div>';
  }
  return '<div class="'+cls+'" onclick="calSelect(\''+ds+'\')"><span>'+num+'</span>'+dot+'</div>';
}
function calShift(dir) {
  CAL_MONTH += dir;
  if (CAL_MONTH>11){CAL_MONTH=0;CAL_YEAR++;} if (CAL_MONTH<0){CAL_MONTH=11;CAL_YEAR--;}
  renderCal();
}
function calSelect(ds) { SEL_DATE = ds===SEL_DATE?null:ds; renderCal(); }
function renderCalDetail() {
  var el = document.getElementById('cal-detail');
  if (!SEL_DATE) { el.innerHTML = ''; return; }
  var day = ST.w[SEL_DATE];
  var h = '<div class="cal-detail"><div class="cal-det-title">📅 '+dateLabel(SEL_DATE)+'</div>';
  if (!day||(!day.workouts&&day.type!=='rest')) {
    h += '<div style="color:var(--sub);font-size:14px;margin-bottom:4px">Нет записей</div>';
  } else if (day.type==='rest') {
    h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
      '<div style="color:var(--sub);font-size:14px;flex:1">День отдыха 💤</div>' +
      '<button onclick="clearRest(\''+SEL_DATE+'\')" style="background:none;border:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:8px;border:1px solid rgba(244,63,94,0.25)">Убрать</button>' +
      '</div>';
  } else {
    day.workouts.forEach(function(w, wi){
      var canRepeat = (w.exercises||[]).length > 0 && !w.planned;
      var icoStyle = 'background:none;border:none;font-size:15px;cursor:pointer;padding:4px 7px;border-radius:8px;border:1px solid rgba(167,139,250,0.3);white-space:nowrap;flex-shrink:0;line-height:1';
      h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">' +
        '<div style="font-size:13px;font-weight:700;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(w.loc==='pool'?'🌊':'🏋️')+' '+esc(w.name)+(w.planned?' <span style="color:var(--pur);font-weight:600">· план</span>':'')+'</div>' +
        '<button onclick="editWorkout(\''+SEL_DATE+'\','+w.id+')" title="Редактировать" style="'+icoStyle+'">✏️</button>' +
        (canRepeat ? '<button onclick="repeatWorkout(\''+SEL_DATE+'\','+w.id+')" title="Повторить на другую дату" style="'+icoStyle+'">🔁</button>' : '') +
        '<button onclick="removeCalWorkout(\''+SEL_DATE+'\','+wi+')" style="background:none;border:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:8px;border:1px solid rgba(244,63,94,0.25);white-space:nowrap;flex-shrink:0">Удалить</button>' +
        '</div>';
      var wSets = 0, wVol = 0;
      (w.exercises||[]).forEach(function(ex){
        (ex.sets||[]).forEach(function(s){
          if (!s.done) return;
          wSets++;
          if ((s.w||0)>0 && !s.warmup) wVol += s.w*(s.r||0);
        });
      });
      if (w.note) {
        h += '<div style="font-size:12px;color:var(--sub);font-style:italic;margin:-2px 0 6px 2px">"'+esc(w.note)+'"</div>';
      }
      if (wSets) {
        h += '<div style="font-size:11.5px;color:var(--mut);margin:-2px 0 6px 2px">'+wSets+' подх.'+(wVol>0?' · '+fmtVol(Math.round(wVol))+' кг':'')+'</div>';
      }
      (w.exercises||[]).forEach(function(ex){
        var done = ex.sets.filter(function(s){return s.done;}).length;
        var maxW = 0; ex.sets.forEach(function(s){ if((s.w||0)>maxW) maxW=s.w||0; });
        h += '<div class="cal-ex-row"><div class="cal-ex-name">'+esc(exTitle(ex))+'</div>' +
          '<div class="cal-ex-meta">'+done+' подх.'+(maxW?' · '+maxW+' кг':'')+'</div></div>';
      });
    });
  }
  var isFuture = SEL_DATE > todayStr();
  var isToday  = SEL_DATE === todayStr();
  h += '<div style="display:flex;gap:8px;margin-top:12px">' +
    '<button class="btn btn-sm" onclick="markRest(\''+SEL_DATE+'\')" style="flex:1">💤 Отдых</button>' +
    (isFuture
      ? '<button class="btn btn-sm btn-plan" onclick="createPlan(null,\''+SEL_DATE+'\');goTab(\'workout\')" style="flex:1">📋 Запланировать</button>'
      : isToday
        ? '<button class="btn btn-acc btn-sm" onclick="startOnDate(\''+SEL_DATE+'\')" style="flex:1">▶ Начать</button>'
        : '<button class="btn btn-sm btn-plan" onclick="logWorkout(\''+SEL_DATE+'\')" style="flex:1">📝 Записать</button>'
    ) +
    '</div></div>';
  el.innerHTML = h;
}
function markRest(ds) {
  if (!ST.w[ds]) ST.w[ds]={type:'rest',workouts:[]}; else ST.w[ds].type='rest';
  saveST(); renderCalDetail(); renderCal();
}
function clearRest(ds) {
  if (ST.w[ds]) { delete ST.w[ds].type; if (!(ST.w[ds].workouts||[]).length) delete ST.w[ds]; }
  saveST(); renderCalDetail(); renderCal();
}
function removeCalWorkout(ds, wi) {
  if (!ST.w[ds]||!ST.w[ds].workouts) return;
  var w = ST.w[ds].workouts[wi];
  var doRemove = function(){
    ST.w[ds].workouts.splice(wi, 1);
    if (!ST.w[ds].workouts.length && ST.w[ds].type!=='rest') delete ST.w[ds];
    saveST(); renderCalDetail(); renderCal();
  };
  var hasDone = w && (w.exercises||[]).some(function(ex){ return (ex.sets||[]).some(function(s){ return s.done; }); });
  if (hasDone) uiConfirm('Удалить «'+(w.name||'Тренировка')+'» за '+dateLabel(ds)+'? Вся история этой тренировки будет потеряна.', doRemove);
  else doRemove();
}
function startOnDate(ds) {
  if (ds===todayStr()) { startWorkout(); goTab('workout'); }
  else { logWorkout(ds); }
}

// Дозаписать прошлую тренировку: создаём запись с датой того дня и открываем редактор
function logWorkout(ds) {
  ensureDay(ds);
  var wid = Date.now();
  var t = new Date(ds + 'T12:00:00').getTime();
  ST.w[ds].workouts.push({id:wid, name:'Тренировка', loc:'gym', startTime:t, endTime:t, exercises:[]});
  saveST();
  PLAN_WKT = {date:ds, wid:wid};
  OPEN_EX = {};
  goTab('workout');
  renderTopbar(); renderWorkout();
}

var TPL_COLORS = ['#22c55e','#38bdf8','#f59e0b','#a78bfa','#f43f5e','#fb923c','#34d399','#60a5fa'];
function tplColor(name) {
  var h = 0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))&0x7fffffff;
  return TPL_COLORS[h % TPL_COLORS.length];
}

function renderTemplates() {

  }

  if (ST.templates.length > 0) {
    h += '<div style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Мои шаблоны</div>';
    ST.templates.forEach(function(tpl, ti){
      var color = tplColor(tpl.name);
      h += '<div class="tpl-card" style="cursor:default">' +
        '<div class="tpl-tile" style="background:'+color+'">'+letterOf(tpl.name)+'</div>' +
        '<div style="flex:1;min-width:0" onclick="useTpl(null,'+ti+')">' +
          '<div class="tpl-name">'+esc(tpl.name)+'</div>' +
          '<div class="tpl-meta">'+(tpl.exs||[]).length+' упражнений</div>' +
          tplExPreview(tpl.exs) +
          '<span class="tpl-badge '+(tpl.loc||'gym')+'">'+((tpl.loc||'gym')==='pool'?'🌊 Бассейн':'🏋️ Зал')+'</span>' +
        '</div>' +
        '<div style="display:flex;gap:6px">' +
          '<button onclick="dupTpl('+ti+')" title="Дублировать" style="background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:4px">⧉</button>' +
          '<button onclick="editTpl('+ti+')" style="background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px">✏️</button>' +
          '<button onclick="delTpl('+ti+')" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px">✕</button>' +
        '</div></div>';
    });
    h += '<div style="height:16px"></div>';
  }

  var rec = getRecommendation();
  h += '<div style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Готовые программы</div>';

      '<div class="tpl-tile" style="background:'+color+'">'+letterOf(tpl.name)+'</div>' +

        '<div class="tpl-name">'+esc(tpl.name)+'</div>' +
        '<div class="tpl-meta">'+tpl.exs.length+' упражнений</div>' +
        tplExPreview(tpl.exs) +
        '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">' +
          '<span class="tpl-badge '+tpl.loc+'">'+((tpl.loc||'gym')==='pool'?'🌊 Бассейн':'🏋️ Зал')+'</span>' +
          (recScore > 0 ? '<span class="tpl-badge" style="background:rgba(34,197,94,0.12);color:var(--acc)">⚡ Сегодня</span>' : '') +
        '</div>' +
      '</div>' +
      '<button onclick="event.stopPropagation();dupBuiltIn(\''+tpl.id+'\')" title="Дублировать в «Мои шаблоны»" style="background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:4px;flex-shrink:0">⧉</button>' +

function useTpl(builtinId, customIdx) {
  var tpl;
  if (builtinId) tpl = BUILT_IN.find(function(t){return t.id===builtinId;});

// ── Выбор шаблона внутри редактора плана ──
function tplPickRow(onclick, name, exs, loc) {
  exs = exs || [];
  var names = exs.map(function(e){ return typeof e==='string'?e:e.name; });
  var preview = names.slice(0,3).join(' · ') + (names.length>3 ? ' +'+(names.length-3) : '');
  return '<button onclick="'+onclick+'" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--brd2);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit">' +
    '<div style="font-size:20px">'+(loc==='pool'?'🌊':'🏋️')+'</div>' +
    '<div style="flex:1;min-width:0">' +

function pStartOfWeek(ds) {
  var d = new Date(ds+'T12:00:00');
  var dow = (d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pWeekLabel(ds) {
  var d = new Date(ds+'T12:00:00');
  return d.getDate()+'.'+pad(d.getMonth()+1);
}
function computeProgressData() {
  var byExName = {}, byCardioName = {}, bySwimName = {}, byStaticName = {};
  var dailyVol = {}, workoutDays = {}, groupSets30 = {}, groupLastDs = {};
  var totalWkts = 0, totalSets = 0, totalVolAll = 0;
  var totalCardioKm = 0, totalCardioMins = 0, totalSwimM = 0, totalStaticSec = 0, totalStairFloors = 0;
  var totalDurationMs = 0, durationCount = 0;
  var maxWorkoutVol = 0;
  var cutoff30 = dateOffset(-30);
  Object.keys(ST.w).sort().forEach(function(ds) {
    var day = ST.w[ds];
    if (!day || !day.workouts || !day.workouts.length) return;
    day.workouts.forEach(function(w) {
      if (w.planned) return;
      var hasAnyDone = (w.exercises||[]).some(function(ex){ return (ex.sets||[]).some(function(s){ return s.done; }); });
      if (!hasAnyDone) return;
      totalWkts++;
      workoutDays[ds] = true;
      if (w.startTime && w.endTime && w.endTime > w.startTime) {
        totalDurationMs += (w.endTime - w.startTime);
        durationCount++;
      }
      var wVol = 0;
      (w.exercises||[]).forEach(function(ex) {
        var grp = exGroup(ex.name);
        var cardio = isCardio(ex.name), swim = isSwim(ex.name), stat = isStatic(ex.name);
        (ex.sets||[]).forEach(function(s) {
          if (!s.done || s.warmup) return;
          totalSets++;
          if (grp) {
            if (ds >= cutoff30) groupSets30[grp] = (groupSets30[grp]||0)+1;
            if (!groupLastDs[grp] || ds > groupLastDs[grp]) groupLastDs[grp] = ds;
          }
          if (cardio) {
            if (isStairs(ex.name)) totalStairFloors += s.dist||0; else totalCardioKm += s.dist||0;
            totalCardioMins += s.mins||0;
            if (!byCardioName[ex.name]) byCardioName[ex.name] = [];
            byCardioName[ex.name].push({ds:ds, dist:s.dist||0, mins:s.mins||0});
          } else if (swim) {
            totalSwimM += s.dist||0;
            var swimKey = (isStyleDrill(ex.name) && ex.style) ? ex.name+' · '+ex.style : ex.name;
            if (!bySwimName[swimKey]) bySwimName[swimKey] = [];
            bySwimName[swimKey].push({ds:ds, dist:s.dist||0, secs:s.secs||0});
          } else if (stat) {
            totalStaticSec += s.secs||0;
            if (!byStaticName[ex.name]) byStaticName[ex.name] = [];
            byStaticName[ex.name].push({ds:ds, secs:s.secs||0});
          } else if ((s.w||0) > 0) {
            var vol = s.w * (s.r||0);
            totalVolAll += vol;
            wVol += vol;
            dailyVol[ds] = (dailyVol[ds]||0) + vol;
            if (!byExName[ex.name]) byExName[ex.name] = [];
            byExName[ex.name].push({ds:ds, w:s.w, r:s.r||0, rpe:s.rpe||0});
          }
        });
      });
      if (wVol > maxWorkoutVol) maxWorkoutVol = wVol;
    });
  });
  return {byExName:byExName, byCardioName:byCardioName, bySwimName:bySwimName, byStaticName:byStaticName,
    dailyVol:dailyVol, workoutDays:workoutDays, groupSets30:groupSets30, groupLastDs:groupLastDs,
    totalWkts:totalWkts, totalSets:totalSets, totalVolAll:totalVolAll, maxWorkoutVol:maxWorkoutVol,
    totalCardioKm:totalCardioKm, totalCardioMins:totalCardioMins, totalSwimM:totalSwimM, totalStaticSec:totalStaticSec, totalStairFloors:totalStairFloors,
    totalDurationMs:totalDurationMs, durationCount:durationCount};
}
function computeStreak(workoutDays) {
  var streak = 0, ds = todayStr();
  if (!workoutDays[ds]) ds = dateAdd(ds, -1);
  while (workoutDays[ds]) { streak++; ds = dateAdd(ds, -1); }
  return streak;
}
function computeBestStreak(workoutDays) {
  var days = Object.keys(workoutDays).sort();
  var best = 0, cur = 0, prev = null;
  days.forEach(function(ds) {
    cur = (prev && dateAdd(prev, 1) === ds) ? cur+1 : 1;
    if (cur > best) best = cur;
    prev = ds;
  });
  return best;
}
function computeWeekdayPattern(workoutDays) {
  var counts = [0,0,0,0,0,0,0]; // Пн..Вс
  Object.keys(workoutDays).forEach(function(ds){
    var d = new Date(ds+'T12:00:00');
    var dow = (d.getDay()+6)%7;
    counts[dow]++;
  });
  return counts;
}

function computeHeatmapDays(workoutDays, dailyVol, weeksBack) {
  var days = [];
  var end = new Date(todayStr()+'T12:00:00');
  var totalDays = weeksBack*7;
  for (var i = totalDays-1; i >= 0; i--) {
    var d = new Date(end); d.setDate(d.getDate()-i);
    var ds = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    days.push({ds:ds, vol:dailyVol[ds]||0, has:!!workoutDays[ds]});
  }
  return days;
}
function heatmapHtml(days) {
  var maxVol = Math.max.apply(null, days.map(function(d){ return d.vol; }).concat([1]));
  var cols = Math.ceil(days.length/7);
  var cell = 11, gap = 3;
  var w = cols*(cell+gap), h = 7*(cell+gap);
  var colors = ['rgba(255,255,255,.06)', 'rgba(34,197,94,.28)', 'rgba(34,197,94,.5)', 'rgba(34,197,94,.75)', '#22c55e'];
  var rects = days.map(function(d,i){
    var col = Math.floor(i/7), row = i%7;
    var x = col*(cell+gap), y = row*(cell+gap);
    var level = 0;
    if (d.has) level = d.vol>0 ? Math.min(4, 1+Math.ceil(d.vol/maxVol*3)) : 1;
    return '<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="2.5" fill="'+colors[level]+'"/>';
  }).join('');
  return '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px">' +
    '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block">'+rects+'</svg></div>';

function computeWeeklyVolume(dailyVol, weeks) {
  var res = [], curWeekStart = pStartOfWeek(todayStr());
  for (var i = weeks-1; i >= 0; i--) {
    var wkStart = dateAdd(curWeekStart, -7*i);
    var kg = 0;
    for (var d = 0; d < 7; d++) kg += dailyVol[dateAdd(wkStart, d)] || 0;
    res.push({start:wkStart, kg:Math.round(kg), isCur:i===0});
  }
  return res;
}
function computePRList(byExName) {
  var list = [];
  Object.keys(byExName).forEach(function(name) {
    var best = null, bestE = 0;
    byExName[name].forEach(function(s) {
      var e = e1RM(s.w, s.r);
      if (e > bestE) { bestE = e; best = s; }
    });
    if (best) list.push({name:name, w:best.w, r:best.r, ds:best.ds});
  });
  list.sort(function(a,b){ return b.ds.localeCompare(a.ds); });
  return list;
}
function countRecentPRs(byExName, cutoffDs) {
  var count = 0;
  Object.keys(byExName).forEach(function(name) {
    var list = byExName[name].slice().sort(function(a,b){ return a.ds.localeCompare(b.ds); });
    var best = 0;
    list.forEach(function(s) {
      var e = e1RM(s.w, s.r);
      if (e > best) {
        if (s.ds >= cutoffDs) count++;
        best = e;
      }
    });
  });
  return count;
}

      '<text x="'+(x+barW/2)+'" y="'+(svgH-5)+'" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.3)" font-weight="600">'+lbl+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+svgW+' '+svgH+'" width="100%" style="display:block">'+rects+'</svg>';

function weekdayPatternHtml(counts) {
  var labels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var max = Math.max.apply(null, counts.concat([1]));
  var n = 7, svgW = 340, barH_max = 60, topPad = 18, botPad = 20;
  var barW = Math.floor((svgW - (n+1)*7) / n);
  var svgH = topPad + barH_max + botPad;
  var rects = counts.map(function(c, i) {
    var x = 7 + i*(barW+7);
    var isMax = c > 0 && c === max;
    var bh = c > 0 ? Math.max(5, Math.round(c/max*barH_max)) : 3;
    var by = topPad + (barH_max - bh);
    var fill = isMax ? '#22c55e' : 'rgba(34,197,94,0.22)';
    return '<rect x="'+x+'" y="'+by+'" width="'+barW+'" height="'+bh+'" rx="5" fill="'+fill+'"/>' +
      (c > 0 ? '<text x="'+(x+barW/2)+'" y="'+(by-5)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="'+(isMax?'#22c55e':'rgba(255,255,255,.38)')+'">'+c+'</text>' : '') +
      '<text x="'+(x+barW/2)+'" y="'+(svgH-5)+'" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.3)" font-weight="600">'+labels[i]+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+svgW+' '+svgH+'" width="100%" style="display:block">'+rects+'</svg>';
}

function weekDeltaBadge(dailyVol) {
  var curStart = pStartOfWeek(todayStr());
  var prevStart = dateAdd(curStart, -7);
  var curKg = 0, prevKg = 0;
  for (var d = 0; d < 7; d++) { curKg += dailyVol[dateAdd(curStart,d)]||0; prevKg += dailyVol[dateAdd(prevStart,d)]||0; }
  if (curKg <= 0 && prevKg <= 0) return '';
  var pct = prevKg > 0 ? Math.round((curKg-prevKg)/prevKg*100) : 100;
  var clr = pct>0?'#22c55e':pct<0?'#f43f5e':'var(--mut)';
  return '<span style="font-size:11px;font-weight:700;color:'+clr+'">'+(pct>0?'+':'')+pct+'% к прошлой неделе</span>';
}

function svgLineChart(vals, dsArr, fmt) {
  var n = vals.length;
  var maxV = Math.max.apply(null, vals), minV = Math.min.apply(null, vals);
  var pad = Math.max((maxV-minV)*0.2, maxV*0.08, 0.5);
  var yMax = maxV+pad, yMin = Math.max(0, minV-pad);
  var range = Math.max(1e-6, yMax-yMin);
  var W=320, H=130, lp=6, rp=6, tp=28, bp=24;
  var cW=W-lp-rp, cH=H-tp-bp;
  var xs = vals.map(function(v,i){ return lp+(n===1?cW/2:i*cW/(n-1)); });
  var ys = vals.map(function(v){ return tp+cH-((v-yMin)/range)*cH; });
  var pathD = xs.map(function(x,i){ return (i===0?'M':'L')+x.toFixed(1)+' '+ys[i].toFixed(1); }).join(' ');
  var fillD = pathD+' L'+xs[n-1].toFixed(1)+' '+(tp+cH)+' L'+lp+' '+(tp+cH)+' Z';

  var gridVals = [yMin, (yMin+yMax)/2, yMax];
  var grid = gridVals.map(function(v) {
    var gy = (tp+cH-((v-yMin)/range)*cH).toFixed(1);
    return '<line x1="'+lp+'" y1="'+gy+'" x2="'+(W-rp)+'" y2="'+gy+'" stroke="rgba(255,255,255,.06)" stroke-width="1"/>' +
      '<text x="'+(W-rp)+'" y="'+(+gy-3)+'" text-anchor="end" font-size="8" fill="rgba(255,255,255,.28)" font-weight="600">'+fmt(v)+'</text>';
  }).join('');

  var dateLbls = n > 1
    ? '<text x="'+xs[0].toFixed(1)+'" y="'+(H-6)+'" text-anchor="start" font-size="8.5" fill="rgba(255,255,255,.3)">'+dateLabel(dsArr[0])+'</text>' +
      '<text x="'+xs[n-1].toFixed(1)+'" y="'+(H-6)+'" text-anchor="end" font-size="8.5" fill="rgba(255,255,255,.3)">'+dateLabel(dsArr[n-1])+'</text>'
    : '';

  var dots = xs.map(function(x,i) {
    var isLast = i===n-1, y = ys[i].toFixed(1);
    return '<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="'+(isLast?5:3)+'" fill="#22c55e"'+(isLast?' stroke="rgba(0,0,0,.7)" stroke-width="2"':'')+'/>' +
      (isLast?'<text x="'+x.toFixed(1)+'" y="'+(+y-9)+'" text-anchor="middle" font-size="10.5" font-weight="800" fill="#22c55e">'+fmt(vals[i])+'</text>':'');
  }).join('');

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible">' +
    '<defs><linearGradient id="pgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".22"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path d="'+fillD+'" fill="url(#pgg)"/>' +
    '<path d="'+pathD+'" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + dateLbls +
    '</svg>';
}
function fmtPace(minsPerKm) {
  if (!minsPerKm || !isFinite(minsPerKm)) return '–';
  var m = Math.floor(minsPerKm), s = Math.round((minsPerKm-m)*60);
  if (s===60) { s=0; m++; }
  return m+':'+(s<10?'0':'')+s;
}

  renderProgress();
}
function measurementsSectionHtml() {
  var m = ST.measurements || {};
  var dates = Object.keys(m).sort();
  var last = dates.length ? m[dates[dates.length-1]] : {};
  var inputs = MEAS_FIELDS.map(function(f){
    return '<div style="flex:1"><div style="font-size:10px;color:var(--mut);margin-bottom:4px">'+f[1]+'</div>' +
      '<input type="number" id="meas-'+f[0]+'" inputmode="decimal" step="0.5" value="'+(last[f[0]]!=null?esc(last[f[0]]):'')+'" placeholder="см" style="width:100%;background:var(--card2);border:1px solid var(--brd2);border-radius:10px;padding:9px 8px;color:var(--txt);font-size:14px;font-family:inherit;box-sizing:border-box" /></div>';
  }).join('');
  var histRows = dates.slice(-10).reverse().map(function(ds){
    var d = m[ds];
    var txt = MEAS_FIELDS.filter(function(f){ return d[f[0]]!=null; }).map(function(f){ return f[1]+' '+nf(d[f[0]]); }).join(' · ');
    if (!txt) return '';
    return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--brd);font-size:13px">' +
      '<span style="color:var(--sub)">'+dateLabel(ds)+'</span><span style="font-weight:600">'+esc(txt)+'</span></div>';
  }).join('');
  var box = '<div class="chart-box"><div class="chart-title">Замеры тела (см)</div>' +
    '<div style="display:flex;gap:8px;margin-bottom:10px">' + inputs + '</div>' +
    '<button class="btn btn-sm" style="width:100%" onclick="logMeasurements()">Сохранить</button>' +
    (histRows ? '<div style="margin-top:10px">'+histRows+'</div>' : '') +
    '</div>';
  MEAS_FIELDS.forEach(function(f){ box += measurementChartHtml(f[0], f[1]); });
  return box;
}
function measurementChartHtml(field, label) {
  var m = ST.measurements || {};
  var dates = Object.keys(m).filter(function(ds){ return m[ds] && m[ds][field] != null; }).sort();
  if (dates.length < 2) return '';
  var dsArr = dates.slice(-30);
  var vals = dsArr.map(function(ds){ return m[ds][field]; });
  var cur = vals[vals.length-1];
  var diff = Math.round((cur-vals[0])*10)/10;
  var hdr = trendHeader([
    {val:nf(cur), unit:'см', lbl:'Текущий', color:'var(--txt)'},
    {val:(diff>0?'+':'')+nf(diff), unit:'см', lbl:'За период', color:'var(--sub)'}
  ]);
  var goal = (ST.goals && ST.goals.measurements && ST.goals.measurements[field]) || 0;
  var goalHtml = '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)">' +
    (goal>0 ? '<div style="font-size:12px;color:var(--sub);margin-bottom:6px">'+bwGoalRemainText(cur, goal, 'см')+'</div>' : '') +
    '<div style="display:flex;gap:8px">' +
    '<input type="number" id="goal-meas-'+field+'" inputmode="decimal" value="'+(goal>0?nf(goal):'')+'" placeholder="Цель, см" style="flex:1;background:var(--card2);border:1px solid var(--brd2);border-radius:10px;padding:8px 10px;color:var(--txt);font-size:13px;font-family:inherit;box-sizing:border-box" />' +
    '<button class="btn btn-sm" onclick="setMeasGoal(\''+field+'\')">Сохранить</button>' +
    '</div></div>';
  return '<div class="chart-box"><div class="chart-title">'+label+'</div>' + hdr + svgLineChart(vals, dsArr, nf) + goalHtml + '</div>';
}
function setMeasGoal(field) {
  var inp = document.getElementById('goal-meas-'+field);
  var v = parseFloat(inp.value);
  if (!ST.goals) ST.goals = {};
  if (!ST.goals.measurements) ST.goals.measurements = {};
  if (v > 0) ST.goals.measurements[field] = Math.round(v*10)/10;
  else delete ST.goals.measurements[field];
  saveST();
  renderProgress();
}
function dataBackupBoxHtml() {
  return '<div class="chart-box"><div class="chart-title">Данные</div>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn btn-sm" style="flex:1" onclick="exportData()">⬇️ Экспорт</button>' +
    '<button class="btn btn-sm" style="flex:1" onclick="document.getElementById(\'import-file-input\').click()">⬆️ Импорт</button>' +
    '</div>' +
    '<input type="file" id="import-file-input" accept="application/json" style="display:none" onchange="importDataFile(this)">' +
    '</div>';
}
function exportData() {
  var blob = new Blob([JSON.stringify(ST)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'gymlog-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function importDataFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data || typeof data.w !== 'object') { uiToast('Некорректный файл'); return; }
      if (!confirm('Заменить текущие данные данными из файла? Текущий прогресс будет перезаписан.')) return;
      ST = data;
      saveST();
      location.reload();
    } catch (err) { uiToast('Не удалось прочитать файл'); }
  };
  reader.readAsText(file);
  input.value = '';
}
function renderProgChart(name) {
  var pd = window._progData || computeProgressData();
  renderExHistory(name, pd);
  var el = document.getElementById('prog-chart'); if (!el) return;
  if (pd.byCardioName[name]) return renderCardioChart(el, name, pd);
  if (pd.bySwimName[name]) return renderSwimChart(el, name, pd);
  if (pd.byStaticName[name]) return renderStaticChart(el, name, pd);
  renderStrengthChart(el, name, pd);
}
function renderExHistory(name, pd) {
  var el = document.getElementById('prog-ex-history'); if (!el) return;
  var rows = [];
  if (pd.byCardioName[name]) {
    pd.byCardioName[name].forEach(function(d){ rows.push({ds:d.ds, txt:nf(d.dist)+' '+distUnit(name)+(d.mins?' · '+d.mins+' мин':'')}); });
  } else if (pd.bySwimName[name]) {
    pd.bySwimName[name].forEach(function(d){ rows.push({ds:d.ds, txt:d.dist+' м'+(d.secs?' · '+fmtTime(d.secs):'')}); });
  } else if (pd.byStaticName[name]) {
    pd.byStaticName[name].forEach(function(d){ rows.push({ds:d.ds, txt:fmtDurLong(d.secs)}); });
  } else if (pd.byExName[name]) {
    pd.byExName[name].forEach(function(d){ rows.push({ds:d.ds, txt:nf(d.w)+' кг × '+d.r+(d.rpe?' · RPE '+d.rpe:'')}); });
  }
  // rows are already in strict ascending chronological order (both across days and
  // within a day, since byExName/byCardioName/etc. are built by walking ST.w dates
  // ascending, then workouts, then sets, in order). A plain reverse() therefore gives
  // true reverse-chronological order at every level; sorting by ds alone would only
  // order by date and leave same-day sets in ascending order, reading as shuffled.
  rows.reverse();
  rows = rows.slice(0, 20);
  if (!rows.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="chart-box"><div class="chart-title">История подходов</div>' +
    rows.map(function(r){
      return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--brd);font-size:13px">' +
        '<span style="color:var(--sub)">'+dateLabelYr(r.ds)+'</span><span style="font-weight:600">'+esc(r.txt)+'</span></div>';
    }).join('') + '</div>';
}
function dateLabelYr(ds) {
  var p = ds.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  var lbl = dateLabel(ds);
  return d.getFullYear() !== new Date().getFullYear() ? lbl+' '+d.getFullYear() : lbl;
}
function renderStrengthChart(el, name, pd) {
  var raw = pd.byExName[name]||[];
  if (!raw.length) { el.innerHTML = ''; return; }
  // dedupe by date, keeping the set with the best effective 1RM that day
  var byDate = {};
  raw.forEach(function(d) {
    var e = e1RM(d.w, d.r);
    if (!byDate[d.ds] || e > byDate[d.ds]._e) { d._e = e; byDate[d.ds] = d; }
  });
  var data = Object.keys(byDate).sort().map(function(ds){ return byDate[ds]; }).slice(-PROG_EX_N);
  var n = data.length;
  var vals = data.map(function(d){ return d.w; });
  var dsArr = data.map(function(d){ return d.ds; });

  var first = vals[0], last = vals[n-1], diff = Math.round((last-first)*10)/10;
  var trendClr = diff>0?'#22c55e':diff<0?'#f43f5e':'rgba(255,255,255,.4)';
  var st = getExStats(name);
  var pr = st ? Math.max(st.pr, last) : last;

  var hdr = trendHeader([
    {val:nf(last), unit:'кг', lbl:'Последний', color:'var(--txt)'},
    {val:nf(pr), unit:'кг', lbl:'Рекорд', color:'var(--ylw)'},
    {val:(diff>0?'+':'')+nf(diff), unit:'кг', lbl:'За период', color:trendClr}
  ]);
  var goal = (ST.goals && ST.goals.byExName && ST.goals.byExName[name]) || 0;
  el.innerHTML = '<div class="chart-box">' + hdr + svgLineChart(vals, dsArr, nf) +
    goalBoxHtml(pr, goal, 'кг', 'goal-ex-input', "setExGoal('"+name.replace(/'/g,"\\'")+"')") + '</div>';
}
function goalBoxHtml(current, target, unit, inputId, saveOnclick) {
  var progress = '';
  if (target > 0) {
    var pct = Math.max(0, Math.min(100, Math.round(current/target*100)));
    var remain = Math.round((target-current)*10)/10;
    progress = '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px">' +
      '<span>'+pct+'% до цели</span><span>'+(remain>0?nf(remain)+' '+unit+' осталось':'Цель достигнута 🎉')+'</span></div>' +
      '<div style="height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-bottom:10px">' +
      '<div style="height:100%;width:'+pct+'%;background:var(--acc)"></div></div>';
  }
  return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)">' + progress +
    '<div style="display:flex;gap:8px">' +
    '<input type="number" id="'+inputId+'" inputmode="decimal" value="'+(target>0?nf(target):'')+'" placeholder="Цель, '+unit+'" style="flex:1;background:var(--card2);border:1px solid var(--brd2);border-radius:10px;padding:8px 10px;color:var(--txt);font-size:13px;font-family:inherit;box-sizing:border-box" />' +
    '<button class="btn btn-sm" onclick="'+saveOnclick+'">Сохранить</button>' +
    '</div></div>';
}
function setExGoal(name) {
  var inp = document.getElementById('goal-ex-input');
  var v = parseFloat(inp.value);
  if (!ST.goals) ST.goals = {};
  if (!ST.goals.byExName) ST.goals.byExName = {};
  if (v > 0) ST.goals.byExName[name] = Math.round(v*10)/10;
  else delete ST.goals.byExName[name];
  saveST();
  renderProgChart(name);
}
function renderCardioChart(el, name, pd) {
  var raw = pd.byCardioName[name]||[];
  if (!raw.length) { el.innerHTML = ''; return; }
  var byDate = {};
  raw.forEach(function(d) {
    if (!byDate[d.ds]) byDate[d.ds] = {ds:d.ds, dist:0, mins:0};
    byDate[d.ds].dist += d.dist; byDate[d.ds].mins += d.mins;
  });
  var data = Object.keys(byDate).sort().map(function(ds){ return byDate[ds]; }).slice(-PROG_EX_N);
  var n = data.length;
  var dsArr = data.map(function(d){ return d.ds; });
  var last = data[n-1], best = data.reduce(function(a,b){ return b.dist>a.dist?b:a; });

  if (isStairs(name)) {
    var stairVals = data.map(function(d){ return d.dist; });
    var stairHdr = trendHeader([
      {val:Math.round(last.dist), unit:'этаж', lbl:'Последний', color:'var(--txt)'},
      {val:Math.round(best.dist), unit:'этаж', lbl:'Лучший', color:'var(--ylw)'}
    ]);
    el.innerHTML = '<div class="chart-box">' + stairHdr + svgLineChart(stairVals, dsArr, Math.round) + '</div>';
    return;
  }

  var paceOf = function(d){ return d.dist>0 ? d.mins/d.dist : 0; };
  var bestPace = data.reduce(function(bp,d){ var p=paceOf(d); return (p>0 && (bp===0||p<bp)) ? p : bp; }, 0);

  var chips = chipsHtml('prog-chip', [['dist','Дистанция'],['pace','Темп']], PROG_CARDIO_MODE, 'progSetCardioMode');
  var vals, fmt, hdr;
  if (PROG_CARDIO_MODE === 'pace') {
    vals = data.map(paceOf);
    fmt = fmtPace;
    hdr = trendHeader([
      {val:fmtPace(paceOf(last)), unit:'/км', lbl:'Последний темп', color:'var(--txt)'},
      {val:fmtPace(bestPace), unit:'/км', lbl:'Лучший темп', color:'var(--ylw)'},
      {val:nf(last.dist), unit:'км', lbl:'Дистанция', color:'var(--blu)'}
    ]);
  } else {
    vals = data.map(function(d){ return d.dist; });
    fmt = nf;
    hdr = trendHeader([
      {val:nf(last.dist), unit:'км', lbl:'Последний', color:'var(--txt)'},
      {val:nf(best.dist), unit:'км', lbl:'Лучший', color:'var(--ylw)'},
      {val:fmtPace(paceOf(last)), unit:'/км', lbl:'Темп', color:'var(--blu)'}
    ]);
  }
  el.innerHTML = '<div class="chart-box">' + chips + hdr + svgLineChart(vals, dsArr, fmt) + '</div>';
}
function renderSwimChart(el, name, pd) {
  var raw = pd.bySwimName[name]||[];
  if (!raw.length) { el.innerHTML = ''; return; }
  var byDate = {};
  raw.forEach(function(d) {
    if (!byDate[d.ds]) byDate[d.ds] = {ds:d.ds, dist:0, secs:0};
    byDate[d.ds].dist += d.dist; byDate[d.ds].secs += d.secs;
  });
  var data = Object.keys(byDate).sort().map(function(ds){ return byDate[ds]; }).slice(-PROG_EX_N);
  var n = data.length;
  var vals = data.map(function(d){ return d.dist; });
  var dsArr = data.map(function(d){ return d.ds; });
  var last = data[n-1], best = data.reduce(function(a,b){ return b.dist>a.dist?b:a; });
  var total = data.reduce(function(a,d){ return a+d.dist; }, 0);

  var hdr = trendHeader([
    {val:last.dist, unit:'м', lbl:'Последний', color:'var(--txt)'},
    {val:best.dist, unit:'м', lbl:'Лучший', color:'var(--ylw)'},
    {val:total, unit:'м', lbl:'Всего', color:'var(--blu)'}
  ]);
  el.innerHTML = '<div class="chart-box">' + hdr + svgLineChart(vals, dsArr, Math.round) + '</div>';
}
function renderStaticChart(el, name, pd) {
  var raw = pd.byStaticName[name]||[];
  if (!raw.length) { el.innerHTML = ''; return; }
  var byDate = {};
  raw.forEach(function(d){ byDate[d.ds] = (byDate[d.ds]||0) + d.secs; });
  var dsArr = Object.keys(byDate).sort().slice(-PROG_EX_N);
  var vals = dsArr.map(function(ds){ return byDate[ds]; });
  var n = vals.length;
  var last = vals[n-1], best = Math.max.apply(null, vals), total = vals.reduce(function(a,v){ return a+v; }, 0);

  var hdr = trendHeader([
    {val:fmtDurLong(last), unit:'', lbl:'Последний', color:'var(--txt)'},
    {val:fmtDurLong(best), unit:'', lbl:'Рекорд', color:'var(--ylw)'},
    {val:fmtDurLong(total), unit:'', lbl:'Всего', color:'var(--blu)'}
  ]);
  el.innerHTML = '<div class="chart-box">' + hdr + svgLineChart(vals, dsArr, function(v){ return fmtDurLong(v); }) + '</div>';
}

// ═══════════════════════ PROFILE ═══════════════════════

// ═══════════════════════ INIT ═══════════════════════
loadST();
renderTopbar();
renderWorkout();
if (ST.recovery && Date.now() < getRecoveryEnd()) startRecoveryTimer();
checkShareImport();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
